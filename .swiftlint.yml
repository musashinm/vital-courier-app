included:
  - App
  - AppTests
  - VitalCourierCore/Package.swift
  - VitalCourierCore/Sources
  - VitalCourierCore/Tests

# swift-format owns layout (.swift-format). These layout rules disagree with its output; the rest agree and stay on.
disabled_rules:
  - line_length
  - trailing_comma
  - opening_brace
  - closure_parameter_position

opt_in_rules:
  - contains_over_first_not_nil
  - empty_count
  - fatal_error_message
  - first_where
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - last_where
  - private_over_fileprivate
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - yoda_condition

identifier_name:
  excluded:
    - db
    - id
    - on
    - to

cyclomatic_complexity:
  warning: 12
